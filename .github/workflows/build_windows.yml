name: Build Windows App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest  # <--- This borrows a Windows PC

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Portable Folder (The "Fast" Way)
      # --onedir creates a folder instead of a slow single file
      run: |
        pyinstaller --name SK_INVERTX_TRADERS --onedir --windowed --icon=logo.ico --add-data "inventory.db;." --add-data "assets;assets" run_app.py

    - name: Create "Run Me" Shortcut
      # This creates a simple batch file so the user doesn't have to look for the exe inside folders
      shell: cmd
      run: |
        echo start dist\SK_INVERTX_TRADERS\SK_INVERTX_TRADERS.exe > "Start_Software.bat"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SK_INVERTX_Windows_Version
        path: |
          dist/SK_INVERTX_TRADERS/
          Start_Software.bat
